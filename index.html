<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="node_modules/modern-normalize/modern-normalize.css">
</head>
<body>
    <div id="mainDiv">
        <div id="logoDiv" class="imageBG">
            <div></div>
            <div id="imageContainer">
                <img id="odinLogo" src="./images/odin-lined.png" alt="Odin Logo">
            </div>
            <div></div>
            <p id="imageCredit">Photo by nate rayfield on Unsplash</p>
        </div>
        <div id="formDiv">
            <div id="textContainer" class="textSection">
                <p id="text">This is not a real online service! You know you need something
                    like this in your life to help you realize your deepest dreams.
                    Sign up <em>now</em> to get started. <br> <br>
                    You <em>know</em> you want to.
                </p>
            </div>
            <div id="form" class="textSection">
                <h2 class="formHeading">Let's do this!</h2>
                <form id="signUp" action="" method="post" class="formContainer">
                    <div class="inputContainer">
                        <label class="labels" for="fn">First Name</label>
                        <input class="inputs" id="fn" type="text">
                    </div>
                    <div class="inputContainer">
                        <label class="labels" for="ln">Last Name</label>
                        <input class="inputs" id="ln" type="text">
                    </div>
                    <div class="inputContainer">
                        <label class="labels" for="email">Email</label>
                        <input class="inputs" id="email" type="email">
                    </div>
                    <div class="inputContainer">
                        <label class="labels" for="pn">Phone Number</label>
                        <input class="inputs" id="pn" type="tel">
                    </div>
                    <div class="inputContainer">
                        <label class="labels" for="pw">Password</label>
                        <input class="inputs" minlength="6" id="pw" type="password">
                    </div>
                    <div class="inputContainer">
                        <label class="labels" for="cpw">Confirm Password</label>
                        <input class="inputs" minlength="6" id="cpw" type="password">
                    </div>
                </form>
            </div>
            <div id="create" class="textSection">
                <button form="signUp" type="submit">Create Account</button>
                <span>Already have an account? <a href="">Log in</a></span>
            </div>
            
        </div>
    </div>
</body>
</html>
