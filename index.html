<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
</head>
<body>
    <div>
        <div id="logoDiv" class="imageBG"></div>
        <div id="formDiv">
            <div id="textContainer" class="">
                <p id="text">This is not a real online service! You know you need something
                    like this in your life to help you realize your deepest dreams.
                    Sign up now to get started. <br> <br>
                    You know you want to.
                </p>
            </div>
            <div id="form">
                <h2>Let's do this!</h2>
                <form id="signUp" action="" method="post">
                    <label for="fn">First Name</label>
                    <input id="fn" type="text">
                    <label for="ln">Last Name</label>
                    <input id="ln" type="text">
                    <label for="email">Email</label>
                    <input id="email" type="email">
                    <label for="pn">Phone Number</label>
                    <input id="pn" type="tel">
                    <label for="pw">Password</label>
                    <input id="pw" type="password">
                    <label for="cpw">Confirm Password</label>
                    <input id="cpw" type="password">
                </form>
            </div>
            <div id="create">
                <button form="signUp" type="submit">Create Account</button>
                <span>Already have an account? <a href="">Log in</a></span>
            </div>
            
        </div>
    </div>
</body>
</html>
